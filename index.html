<script>

async function searchProblem() {

    const plotterType =
        document.getElementById("plotter_type").value;

    const connection =
        document.getElementById("connection").value;

    const issue =
        document.getElementById("issue").value.trim();


    if (!issue) {

        alert("لطفاً مشکل پلاتر را وارد کنید.");

        return;
    }


    const resultBox =
        document.getElementById("result");

    const answerBox =
        document.getElementById("answer");

    const sourceBox =
        document.getElementById("source");


    resultBox.style.display = "block";

    answerBox.innerHTML =
        '<div class="loading">⏳ در حال بررسی مشکل...</div>';

    sourceBox.innerText = "";


    try {

        const url =
            `/troubleshoot-ai?plotter_type=${encodeURIComponent(plotterType)}&connection=${encodeURIComponent(connection)}&issue=${encodeURIComponent(issue)}`;


        const response = await fetch("https://plotter-ai.onrender.com/ask", {
            method: "POST",
            headers: {
            "Content-Type": "application/json"
            },
            body: JSON.stringify({
                plotter_type: plotterType,
                connection: connection,
                text: issue
            })
        });
            

        if (!response.ok) {

            throw new Error("خطا در ارتباط با سرور");
        }


        const data =
            await response.json();
        console.log("🔥 SERVER RESPONSE:", JSON.stringify(data));

if (data.status === "found") {

    answerBox.innerText = data.answer;

    sourceBox.innerText =
        "📚 منبع پاسخ: پایگاه دانش شرکت";

}

else if (data.status === "ai_answer") {

    answerBox.innerText = data.answer;

    sourceBox.innerText =
        "🤖 منبع پاسخ: هوش مصنوعی";

}

else {

    answerBox.innerText =
        "پاسخی برای این مشکل پیدا نشد.";

    sourceBox.innerText = "";

}


    } catch (error) {

        console.error(error);

        answerBox.innerHTML =
            '<div class="error">ارتباط با سرور با مشکل مواجه شد. لطفاً دوباره تلاش کنید.</div>';

    }

}

</script>
